<svg width="1200" height="200" viewBox="0 0 1200 200" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="200" rx="20" fill="#1E1E1E"/>
  <text x="64" y="72" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Install one table. Own the code.</text>
  <text x="64" y="104" font-size="17" fill="#A1A1AA">Every example is a shadcn registry item, for TanStack Table v8 and v9.</text>
  <rect x="64" y="126" width="760" height="46" rx="10" fill="#27272A" stroke="#3F3F46"/>
  <text x="84" y="155" font-size="16" fill="#E4E4E7" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan fill="#71717A">$ </tspan>npx shadcn add https://www.shad-table.dev/r/tree-table.json</text>
  <g font-size="15" fill="#E4E4E7">
    <rect x="900" y="40" width="236" height="36" rx="18" fill="#27272A" stroke="#3F3F46"/>
    <text x="1018" y="63" text-anchor="middle">34 copy-paste components</text>
    <rect x="900" y="88" width="236" height="36" rx="18" fill="#27272A" stroke="#3F3F46"/>
    <text x="1018" y="111" text-anchor="middle">shadcn/ui + Tailwind v4</text>
    <rect x="900" y="136" width="236" height="36" rx="18" fill="#27272A" stroke="#3F3F46"/>
    <text x="1018" y="159" text-anchor="middle">React + Vue source</text>
  </g>
</svg>
